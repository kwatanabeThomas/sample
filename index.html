<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモン マインスイーパー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #1a3a1a 0%, #0d2b0d 40%, #0a1f0a 100%);
      font-family: 'Segoe UI', 'Meiryo', sans-serif;
      color: #e8f5e9;
      padding: 16px;
    }

    /* ---- title ---- */
    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.9rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 16px rgba(100,255,100,0.5), 0 2px 4px rgba(0,0,0,0.8);
    }
    .title-sub {
      font-size: 0.78rem;
      color: #88bb88;
      margin-bottom: 18px;
      letter-spacing: 0.05em;
    }

    /* ---- difficulty ---- */
    .difficulty {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .difficulty button {
      padding: 7px 18px;
      border: 2px solid rgba(100,220,100,0.35);
      border-radius: 20px;
      background: rgba(0,80,0,0.35);
      color: #c8e6c9;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .difficulty button:hover,
    .difficulty button.active {
      background: rgba(50,160,50,0.4);
      border-color: rgba(100,220,100,0.9);
      color: #fff;
      box-shadow: 0 0 10px rgba(100,220,100,0.35);
    }

    /* ---- status bar ---- */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 620px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(100,200,100,0.25);
      border-radius: 12px;
      padding: 10px 18px;
      margin-bottom: 10px;
      font-size: 1rem;
      gap: 8px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-variant-numeric: tabular-nums;
      min-width: 56px;
    }
    .status-label {
      font-size: 0.72rem;
      color: #88bb88;
      display: block;
      line-height: 1;
    }
    .status-val {
      font-size: 1.15rem;
      font-weight: bold;
      color: #e8f5e9;
    }

    #reset-btn {
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s;
      line-height: 1;
      flex-shrink: 0;
    }
    #reset-btn:hover { transform: scale(1.2) rotate(-5deg); }

    /* ---- hint button ---- */
    .hint-wrap {
      margin-bottom: 14px;
    }
    #hint-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 22px;
      border-radius: 24px;
      border: 2px solid rgba(255,220,50,0.6);
      background: rgba(120,90,0,0.4);
      color: #ffe082;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #hint-btn:hover:not(:disabled) {
      background: rgba(180,130,0,0.5);
      box-shadow: 0 0 14px rgba(255,220,50,0.4);
    }
    #hint-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(255,220,50,0.2);
    }
    #hint-btn .hint-uses {
      font-size: 0.75rem;
      background: rgba(255,220,50,0.2);
      border-radius: 10px;
      padding: 1px 7px;
    }

    /* ---- board wrapper ---- */
    .board-wrap {
      overflow: auto;
      max-width: 100vw;
      padding-bottom: 4px;
    }

    /* ---- grid ---- */
    #board {
      display: grid;
      gap: 2px;
      background: rgba(0,0,0,0.6);
      border: 3px solid rgba(80,160,80,0.5);
      border-radius: 10px;
      padding: 6px;
      user-select: none;
      box-shadow: 0 0 30px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.3);
    }

    /* ---- cells ---- */
    .cell {
      width: 36px;
      height: 36px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid rgba(80,130,80,0.3);
      transition: background 0.1s, transform 0.08s, box-shadow 0.1s;
      background: linear-gradient(145deg, rgba(40,100,40,0.7), rgba(20,60,20,0.8));
      position: relative;
      overflow: hidden;
    }
    .cell:hover:not(.revealed):not(.flagged) {
      background: linear-gradient(145deg, rgba(80,160,80,0.6), rgba(40,100,40,0.7));
      transform: scale(1.08);
      box-shadow: 0 0 8px rgba(100,220,100,0.3);
      border-color: rgba(100,200,100,0.5);
    }
    .cell.revealed {
      background: rgba(0,0,0,0.35);
      cursor: default;
      border-color: rgba(255,255,255,0.04);
    }
    .cell.hint-flash {
      animation: hintPulse 0.6s ease-out;
    }
    @keyframes hintPulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,220,50,0.9); transform: scale(1.15); }
      100% { box-shadow: 0 0 16px 8px rgba(255,220,50,0); transform: scale(1); }
    }

    /* ---- Pikachu flag ---- */
    .cell.flagged {
      background: linear-gradient(145deg, rgba(60,40,0,0.7), rgba(40,25,0,0.8));
      border-color: rgba(255,200,50,0.6);
    }
    .pikachu {
      position: relative;
      width: 22px;
      height: 20px;
      flex-shrink: 0;
    }
    /* face */
    .pikachu::before {
      content: '';
      position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 18px; height: 16px;
      background: #FFD700;
      border-radius: 50%;
      border: 1.5px solid #b8860b;
    }
    /* left ear */
    .pikachu-ear-l,
    .pikachu-ear-r {
      position: absolute;
      width: 6px; height: 9px;
      background: #FFD700;
      border: 1.5px solid #b8860b;
      top: 0;
      border-radius: 50% 50% 0 0;
    }
    .pikachu-ear-l { left: 1px;  transform: rotate(-15deg); }
    .pikachu-ear-r { right: 1px; transform: rotate(15deg); }
    /* ear tips (black) */
    .pikachu-ear-l::after,
    .pikachu-ear-r::after {
      content: '';
      position: absolute;
      width: 6px; height: 4px;
      background: #222;
      top: 0; left: -1px;
      border-radius: 50% 50% 0 0;
    }
    /* cheeks */
    .pikachu-cheek-l,
    .pikachu-cheek-r {
      position: absolute;
      width: 5px; height: 3px;
      background: #ff6b6b;
      border-radius: 50%;
      bottom: 3px;
    }
    .pikachu-cheek-l { left: 2px; }
    .pikachu-cheek-r { right: 2px; }
    /* eyes */
    .pikachu-eyes {
      position: absolute;
      bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 12px;
      display: flex;
      justify-content: space-between;
    }
    .pikachu-eyes::before,
    .pikachu-eyes::after {
      content: '';
      width: 3px; height: 4px;
      background: #333;
      border-radius: 50%;
      display: block;
    }

    /* ---- Electrode mine ---- */
    .electrode {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #cc1111 50%, #f0f0f0 50%);
      border: 2px solid #222;
      position: relative;
      flex-shrink: 0;
      box-shadow: inset -3px -3px 6px rgba(0,0,0,0.3), inset 2px 2px 4px rgba(255,255,255,0.2);
    }
    .electrode::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: calc(50% - 3px);
      height: 6px;
      background: #222;
    }
    .electrode::after {
      content: '';
      position: absolute;
      width: 9px; height: 9px;
      background: #333;
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 1.5px solid #555;
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.3);
    }
    .cell.mine-explode {
      background: rgba(255,60,20,0.7) !important;
      border-color: #ff4400 !important;
      animation: explodeShake 0.4s ease-out;
    }
    @keyframes explodeShake {
      0%,100% { transform: translate(0,0); }
      20% { transform: translate(-3px,2px); }
      40% { transform: translate(3px,-2px); }
      60% { transform: translate(-2px,-3px); }
      80% { transform: translate(2px,3px); }
    }
    .cell.mine-shown {
      background: rgba(50,50,50,0.55);
      cursor: default;
    }

    /* number type colours */
    .n1 { color: #64b5f6; }
    .n2 { color: #81c784; }
    .n3 { color: #e57373; }
    .n4 { color: #ba68c8; }
    .n5 { color: #ffb74d; }
    .n6 { color: #4dd0e1; }
    .n7 { color: #f48fb1; }
    .n8 { color: #bdbdbd; }

    /* ---- overlays ---- */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay.show { display: flex; }

    .overlay-box {
      background: linear-gradient(145deg, #0a2a0a, #061806);
      border: 2px solid rgba(100,220,100,0.5);
      border-radius: 18px;
      padding: 36px 48px;
      text-align: center;
      box-shadow: 0 0 50px rgba(50,180,50,0.2);
      max-width: 90vw;
    }
    .overlay-box .ov-icon { font-size: 3.5rem; margin-bottom: 10px; line-height: 1; }
    .overlay-box h2 { font-size: 1.7rem; margin-bottom: 8px; }
    .overlay-box p  { color: #88bb88; margin-bottom: 22px; font-size: 0.95rem; }

    .overlay-box button {
      padding: 10px 32px;
      border-radius: 24px;
      border: 2px solid rgba(100,220,100,0.6);
      background: rgba(40,120,40,0.3);
      color: #c8e6c9;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .overlay-box button:hover {
      background: rgba(60,160,60,0.45);
      box-shadow: 0 0 16px rgba(100,220,100,0.4);
      color: #fff;
    }

    /* mobile */
    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; }
      .cell { width: 30px; height: 30px; font-size: 0.78rem; }
      .electrode { width: 21px; height: 21px; }
      .pikachu { width: 18px; height: 16px; }
    }
  </style>
</head>
<body>

<div class="title-wrap">
  <h1>ポケモン マインスイーパー</h1>
</div>
<p class="title-sub">マルマインを避けてフィールドを踏破せよ！</p>

<div class="difficulty">
  <button data-level="easy" class="active">初級 (9×9)</button>
  <button data-level="medium">中級 (16×16)</button>
  <button data-level="hard">上級 (30×16)</button>
</div>

<div class="status-bar">
  <div class="status-item">
    <span class="status-label">ピカチュウ</span>
    <span class="status-val" id="flag-count">0</span>
  </div>
  <button id="reset-btn" title="リセット">🙂</button>
  <div class="status-item" style="justify-content:flex-end">
    <span class="status-label">タイム</span>
    <span class="status-val" id="timer">0</span>
  </div>
</div>

<div class="hint-wrap">
  <button id="hint-btn" onclick="useHint()">
    <span>💡 ヒント</span>
    <span class="hint-uses" id="hint-uses">残り 1 回</span>
  </button>
</div>

<div class="board-wrap">
  <div id="board"></div>
</div>

<!-- Win overlay -->
<div class="overlay" id="win-overlay">
  <div class="overlay-box">
    <div class="ov-icon">🏆</div>
    <h2>やった！クリア！</h2>
    <p id="win-time"></p>
    <button onclick="newGame()">もう一度あそぶ</button>
  </div>
</div>

<!-- Lose overlay -->
<div class="overlay" id="lose-overlay">
  <div class="overlay-box">
    <div class="ov-icon">💥</div>
    <h2>マルマインに当たった！</h2>
    <p>また挑戦してみよう！</p>
    <button onclick="newGame()">もう一度あそぶ</button>
  </div>
</div>

<script>
  const LEVELS = {
    easy:   { cols: 9,  rows: 9,  mines: 10 },
    medium: { cols: 16, rows: 16, mines: 40 },
    hard:   { cols: 30, rows: 16, mines: 99 },
  };

  let level    = 'easy';
  let cfg      = LEVELS[level];
  let board    = [];
  let revealed = 0;
  let flags    = 0;
  let gameOver = false;
  let started  = false;
  let timerVal = 0;
  let timerID  = null;
  let hintUsed = false;

  const boardEl     = document.getElementById('board');
  const flagEl      = document.getElementById('flag-count');
  const timerEl     = document.getElementById('timer');
  const resetBtn    = document.getElementById('reset-btn');
  const winOverlay  = document.getElementById('win-overlay');
  const loseOverlay = document.getElementById('lose-overlay');
  const hintBtn     = document.getElementById('hint-btn');
  const hintUsesEl  = document.getElementById('hint-uses');

  document.querySelectorAll('.difficulty button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector('.difficulty button.active').classList.remove('active');
      btn.classList.add('active');
      level = btn.dataset.level;
      cfg   = LEVELS[level];
      newGame();
    });
  });

  resetBtn.addEventListener('click', newGame);

  /* ================================================================
     Game
  ================================================================ */

  function newGame() {
    clearInterval(timerID);
    timerVal  = 0;
    started   = false;
    gameOver  = false;
    revealed  = 0;
    flags     = 0;
    hintUsed  = false;

    timerEl.textContent  = '0';
    flagEl.textContent   = '0';
    resetBtn.textContent = '🙂';
    hintBtn.disabled     = false;
    hintUsesEl.textContent = '残り 1 回';

    winOverlay.classList.remove('show');
    loseOverlay.classList.remove('show');

    board = [];
    for (let r = 0; r < cfg.rows; r++) {
      board.push([]);
      for (let c = 0; c < cfg.cols; c++) {
        board[r].push({ mine: false, revealed: false, flagged: false, adjacent: 0 });
      }
    }
    renderBoard();
  }

  function placeMines(safeR, safeC) {
    let placed = 0;
    while (placed < cfg.mines) {
      const r = Math.floor(Math.random() * cfg.rows);
      const c = Math.floor(Math.random() * cfg.cols);
      if (board[r][c].mine) continue;
      if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
      board[r][c].mine = true;
      placed++;
    }
    for (let r = 0; r < cfg.rows; r++) {
      for (let c = 0; c < cfg.cols; c++) {
        if (board[r][c].mine) continue;
        board[r][c].adjacent = neighbors(r, c).filter(([nr, nc]) => board[nr][nc].mine).length;
      }
    }
  }

  function neighbors(r, c) {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < cfg.rows && nc >= 0 && nc < cfg.cols) out.push([nr, nc]);
      }
    }
    return out;
  }

  /* ----------------------------------------------------------------
     Rendering
  ---------------------------------------------------------------- */

  function makePikachuEl() {
    const wrap = document.createElement('div');
    wrap.className = 'pikachu';
    wrap.innerHTML = '<div class="pikachu-ear-l"></div>'
                   + '<div class="pikachu-ear-r"></div>'
                   + '<div class="pikachu-cheek-l"></div>'
                   + '<div class="pikachu-cheek-r"></div>'
                   + '<div class="pikachu-eyes"></div>';
    return wrap;
  }

  function makeElectrodeEl() {
    const el = document.createElement('div');
    el.className = 'electrode';
    return el;
  }

  function renderBoard() {
    boardEl.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
    boardEl.innerHTML = '';

    for (let r = 0; r < cfg.rows; r++) {
      for (let c = 0; c < cfg.cols; c++) {
        const el = document.createElement('div');
        el.className = 'cell';
        el.dataset.r = r;
        el.dataset.c = c;

        el.addEventListener('click',       onLeftClick);
        el.addEventListener('contextmenu', onRightClick);
        el.addEventListener('touchstart',  onTouchStart, { passive: true });
        el.addEventListener('touchend',    onTouchEnd);
        el.addEventListener('touchmove',   onTouchMove,  { passive: true });

        boardEl.appendChild(el);
      }
    }
  }

  function cellEl(r, c) {
    return boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
  }

  function updateCell(r, c) {
    const cell = board[r][c];
    const el   = cellEl(r, c);
    if (!el) return;

    el.className = 'cell';
    el.innerHTML = '';

    if (cell.flagged) {
      el.classList.add('flagged');
      el.appendChild(makePikachuEl());
    } else if (cell.revealed) {
      el.classList.add('revealed');
      if (cell.mine) {
        el.appendChild(makeElectrodeEl());
      } else if (cell.adjacent > 0) {
        el.textContent = cell.adjacent;
        el.classList.add('n' + cell.adjacent);
      }
    }
  }

  /* ----------------------------------------------------------------
     Hint
  ---------------------------------------------------------------- */

  function useHint() {
    if (hintUsed || gameOver) return;

    if (!started) {
      // 未開始のときは中央付近を安全基点として地雷を配置してから実行
      const safeR = Math.floor(cfg.rows / 2);
      const safeC = Math.floor(cfg.cols / 2);
      started = true;
      placeMines(safeR, safeC);
      timerID = setInterval(() => { timerVal++; timerEl.textContent = timerVal; }, 1000);
    }

    const safeCells = [];
    for (let r = 0; r < cfg.rows; r++) {
      for (let c = 0; c < cfg.cols; c++) {
        const cell = board[r][c];
        if (!cell.mine && !cell.revealed && !cell.flagged) safeCells.push([r, c]);
      }
    }
    if (safeCells.length === 0) return;

    hintUsed = true;
    hintBtn.disabled = true;
    hintUsesEl.textContent = '使用済み';

    const idx = Math.floor(Math.random() * safeCells.length);
    const [r, c] = safeCells[idx];

    reveal(r, c);

    // 光らせる演出
    const el = cellEl(r, c);
    if (el) {
      el.classList.add('hint-flash');
      el.addEventListener('animationend', () => el.classList.remove('hint-flash'), { once: true });
    }

    checkWin();
  }

  /* ----------------------------------------------------------------
     Interactions
  ---------------------------------------------------------------- */

  let touchTimer = null;
  let touchMoved = false;

  function onTouchStart(e) {
    touchMoved = false;
    touchTimer = setTimeout(() => {
      if (!touchMoved) {
        const el = e.currentTarget;
        toggleFlag(+el.dataset.r, +el.dataset.c);
      }
    }, 500);
  }
  function onTouchMove()  { touchMoved = true; clearTimeout(touchTimer); }
  function onTouchEnd()   { clearTimeout(touchTimer); }

  function onLeftClick(e) {
    const r = +e.currentTarget.dataset.r;
    const c = +e.currentTarget.dataset.c;
    if (gameOver || board[r][c].flagged || board[r][c].revealed) return;

    if (!started) {
      started = true;
      placeMines(r, c);
      timerID = setInterval(() => { timerVal++; timerEl.textContent = timerVal; }, 1000);
    }

    if (board[r][c].mine) {
      explode(r, c);
    } else {
      reveal(r, c);
      checkWin();
    }
  }

  function onRightClick(e) {
    e.preventDefault();
    const r = +e.currentTarget.dataset.r;
    const c = +e.currentTarget.dataset.c;
    if (gameOver || board[r][c].revealed) return;
    toggleFlag(r, c);
  }

  function toggleFlag(r, c) {
    if (gameOver || board[r][c].revealed) return;
    const cell = board[r][c];
    cell.flagged = !cell.flagged;
    flags += cell.flagged ? 1 : -1;
    flagEl.textContent = flags;
    updateCell(r, c);
  }

  function reveal(r, c) {
    const stack = [[r, c]];
    while (stack.length) {
      const [cr, cc] = stack.pop();
      const cell = board[cr][cc];
      if (cell.revealed || cell.flagged || cell.mine) continue;
      cell.revealed = true;
      revealed++;
      updateCell(cr, cc);
      if (cell.adjacent === 0) neighbors(cr, cc).forEach(n => stack.push(n));
    }
  }

  function explode(r, c) {
    gameOver = true;
    clearInterval(timerID);
    resetBtn.textContent = '😵';

    for (let i = 0; i < cfg.rows; i++) {
      for (let j = 0; j < cfg.cols; j++) {
        if (board[i][j].mine && !board[i][j].flagged) {
          board[i][j].revealed = true;
          updateCell(i, j);
          if (i !== r || j !== c) cellEl(i, j).classList.add('mine-shown');
        }
      }
    }
    const el = cellEl(r, c);
    el.classList.add('mine-explode');
    el.innerHTML = '<span style="font-size:1.3rem">💥</span>';

    setTimeout(() => loseOverlay.classList.add('show'), 700);
  }

  function checkWin() {
    const safe = cfg.rows * cfg.cols - cfg.mines;
    if (revealed === safe) {
      gameOver = true;
      clearInterval(timerID);
      resetBtn.textContent = '😎';
      document.getElementById('win-time').textContent = `クリアタイム: ${timerVal} 秒`;
      setTimeout(() => winOverlay.classList.add('show'), 400);
    }
  }

  newGame();
</script>
</body>
</html>
